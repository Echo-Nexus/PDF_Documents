<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOCUMENT VIEWER WITH DYNAMIC MENU</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Symbols -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="overlay" id="overlay" onclick="window.toggleMenu()"></div>

    <!-- Sidebar Menu -->
    <aside class="sidebar" id="sidebar">
      <div
        class="p-6 border-b border-slate-700 flex justify-between items-center"
      >
        <h2 class="text-lg font-bold tracking-tight text-white">LIBRARY</h2>
        <!-- Close button for mobile -->
        <button
          onclick="window.toggleMenu()"
          class="md:hidden text-slate-400 hover:text-white"
        >
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <nav class="flex-1 overflow-y-auto mt-2" id="documentList">
        <!-- Dynamic items -->
      </nav>
      <div
        class="p-4 bg-slate-900/50 text-[10px] text-slate-500 text-center uppercase tracking-widest"
      >
        Document Navigation
      </div>
    </aside>

    <!-- Content Area -->
    <main class="main-content">
      <header class="header">
        <div class="flex items-center gap-4">
          <button
            onclick="window.toggleMenu()"
            class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 flex items-center justify-center"
            title="Toggle Menu"
          >
            <span class="material-symbols-rounded">menu</span>
          </button>
          <div>
            <h1
              id="headerTitle"
              class="text-sm font-bold text-slate-800 uppercase"
            >
              Select Document
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <a
            id="extLink"
            href="#"
            target="_blank"
            class="p-2 hover:bg-slate-100 rounded-lg text-slate-500 flex items-center justify-center"
            title="Open Externally"
          >
            <span class="material-symbols-rounded">open_in_new</span>
          </a>
        </div>
      </header>

      <div class="iframe-container">
        <div id="loader" class="loader">
          <svg
            class="animate-spin h-8 w-8 text-blue-500"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        </div>
        <iframe id="docFrame" src=""></iframe>
      </div>
    </main>
    <script src="data.js"></script>
    <script src="logic.js"></script>
  </body>
</html>
